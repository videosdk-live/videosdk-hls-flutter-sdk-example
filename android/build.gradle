allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some plugins (e.g. videosdk) hardcode an older compileSdkVersion than
// their own dependencies (e.g. device_info_plus) now require. Force every
// Android library module to compile against the same SDK level as the app
// to avoid AAR metadata mismatches. This only affects which compile-time
// API stubs are visible, not runtime behavior.
subprojects { proj ->
    def alignCompileSdk = {
        if (proj.plugins.hasPlugin('com.android.library') || proj.plugins.hasPlugin('com.android.application')) {
            def targetCompileSdk = 36
            def current = proj.android.compileSdkVersion?.toString()?.replaceAll('[^0-9]', '')?.toInteger() ?: 0
            if (current < targetCompileSdk) {
                proj.android.compileSdkVersion targetCompileSdk
            }
        }
    }
    if (proj.state.executed) {
        alignCompileSdk()
    } else {
        proj.afterEvaluate { alignCompileSdk() }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
